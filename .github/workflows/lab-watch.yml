# مراقِب صمت المختبر — يسكن عند GitHub لا على الخادم الذي يراقبه (قرار المالك 09-10).
# يعمل 19:30 الرياض (16:30 UTC) الأحد–الخميس: بعد آخر نزولٍ معقول للتشغيلة (~16:35 الرياض
# + تشغيلة ثقيلة) بثلاث ساعات. ويفتح issue واحدة بوسم lab-silent حين يتأخر الختم،
# ويغلقها حين يعود — فالإشعار بريد GitHub الافتراضي للمالك، بلا أي مفتاح أو بنية.
name: lab-watch
on:
  schedule:
    - cron: "30 16 * * 0-4"
  workflow_dispatch:
permissions:
  contents: read
  issues: write
jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          sparse-checkout: |
            scripts/lab-watch.py
            stocks-data.json
          sparse-checkout-cone-mode: false
      - name: افحص الختم وحدّث الـissue
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: python3 scripts/lab-watch.py --data stocks-data.json
